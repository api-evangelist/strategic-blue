name: Strategic Blue
description: >-
  Strategic Blue is a UK-headquartered cloud FinOps company founded in 2010 by
  Dr James Mitchell, a former commodities trader. It specialises in AWS rate
  optimization through commitment management, delivering Reserved Instance and
  Savings Plan savings of up to 40-45% without lock-in, forecasting burden, or
  technical compromise. Strategic Blue treats cloud like a commodity, applying
  price-risk-management techniques from financial markets to optimize AWS
  discounts. Its Automate service serves commercial enterprises while Accelerate
  serves the UK public sector. The company operates on a least-privilege model,
  accessing only cost and usage metadata and never customer cloud environments.
  It is ISO 27001, ISO 9001, and ISO 14001 certified, CSA STAR and Cyber
  Essentials registered, and an AWS Advanced and Google Cloud Premier partner.
